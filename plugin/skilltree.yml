name: Skilltree
description: >-
  (Alpha) Turns the library into a skill tree of topics and levels that you
  unlock by watching, following and performing what the clips ask.
version: 0.1.0
url: https://github.com/stashapp/stash

ui:
  javascript:
    - skilltree.js
  css:
    - skilltree.css
    - skilltree-play.css

settings:
  defaultNeed:
    displayName: Scenes per level
    description: >-
      Completed scenes needed to complete a level when its tag has no st.need.
      Default 2.
    type: NUMBER
  dayStartHour:
    displayName: Day starts at (hour)
    description: >-
      Hour of the day (0-23, local time) when a new day begins for streaks,
      the daily earn cap and daily series. Default 4: a clip finished at
      02:30 still counts for the evening before. 0 = midnight.
    type: NUMBER
  gazeSource:
    displayName: Eye tracker
    description: >-
      Where gaze comes from for the attention check: off (default; attention
      is judged from window focus and activity), tobii (Tobii 4C / ET5 over
      WebUSB in Chrome or Edge; on Windows stop the Tobii services first) or
      mouse (the pointer stands in for gaze, for testing). Calibrate at
      /skilltree/calibrate.
    type: STRING
  snapFlash:
    displayName: Snap flash brightness (%)
    description: >-
      When a scene's funscript has a "snap" axis, the video flashes white at
      each snap while the clip plays. Brightness 0-100, default 60; 0 turns
      the flashes off. For photosensitivity safety there are never more than
      3 flashes in any one second (the WCAG 2.3.1 seizure threshold); snaps
      beyond that are skipped. With "reduce motion" set in your system, the
      flash is a much dimmer, slower pulse at most once per second. Turn this
      off if flashing light affects you.
    type: NUMBER
