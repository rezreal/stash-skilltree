name: Skilltree
description: >-
  (Alpha) Turns the library into a skill tree of topics and levels that you
  unlock by watching, following and performing what the clips ask.
version: 0.1.0
url: https://github.com/stashapp/stash

ui:
  javascript:
    - skilltree.js
  css:
    - skilltree.css

settings:
  defaultNeed:
    displayName: Scenes per level
    description: >-
      Completed scenes needed to complete a level when its tag has no st.need.
      Default 2.
    type: NUMBER
