name: Skilltree
description: >-
  (Alpha) Turns the library into a skill tree of topics and levels that you
  unlock by watching, following and performing what the clips ask.
version: 0.3.0
url: https://github.com/stashapp/stash

ui:
  javascript:
    - skilltree.js
  css:
    - skilltree.css
    - skilltree-play.css
    - skilltree-checks.css
  # models and wasm for vision and speech, fetched by tools/fetch_models.sh
  # into plugin/assets/ and served at /plugin/skilltree/assets/...
  assets:
    /: assets

settings:
  defaultNeed:
    displayName: Scenes per level
    description: >-
      Completed scenes needed to complete a level when its tag has no st.need.
      Default 2.
    type: NUMBER
  dayStartHour:
    displayName: Day starts at (hour)
    description: >-
      Hour of the day (0-23, local time) when a new day begins for streaks,
      the daily earn cap and daily series. Default 4: a clip finished at
      02:30 still counts for the evening before. 0 = midnight.
    type: NUMBER
  gazeSource:
    displayName: Eye tracker
    description: >-
      Where gaze comes from for the attention check: off (default; attention
      is judged from window focus and activity), tobii (Tobii 4C / ET5 over
      WebUSB in Chrome or Edge; on Windows stop the Tobii services first) or
      mouse (the pointer stands in for gaze, for testing). Calibrate at
      /skilltree/calibrate.
    type: STRING
  eyesClosedDim:
    displayName: Dim while eyes are closed (%)
    description: >-
      While a marker asks you to close your eyes, the video dims a little
      (fading in and out over about a second): the cue to close them, and
      what you see if you peek. Default 30; 0 turns it off; never darker
      than 60 so the screen stays visible and still lights your face for
      the webcam.
    type: NUMBER
  focusBlur:
    displayName: Blur around the gaze target (%)
    description: >-
      While a marker asks you to look at part of the clip (the eyes, face,
      mouth, hands, chest, ...), everything around that part blurs: more
      the further from it, and more and more over the first seconds of the
      prompt. The part you should look at stays sharp. Needs video analysis
      for targets on the person. Default 60; 0 turns it off; 100 is the
      strongest blur.
    type: NUMBER
  snapFlash:
    displayName: Snap flash brightness (%)
    description: >-
      When a scene's funscript has a "snap" axis, the video flashes white at
      each snap while the clip plays. Brightness 0-100, default 60; 0 turns
      the flashes off. For photosensitivity safety there are never more than
      3 flashes in any one second (the WCAG 2.3.1 seizure threshold); snaps
      beyond that are skipped. With "reduce motion" set in your system, the
      flash is a much dimmer, slower pulse at most once per second. Turn this
      off if flashing light affects you.
    type: NUMBER
  sensorService:
    displayName: Distance sensor service UUID
    description: >-
      GATT service of the Bluetooth distance sensor used by track clips
      (funscript following), e.g. 0xffe0 or a full UUID like
      6e400001-b5a3-f393-e0a9-e50e24dcca9e. Don't know it? Open
      /skilltree/sensor and use "Find my sensor": it lists what the sensor
      offers and can save these settings for you. Needs Chrome or Edge and
      stash over https (or http://localhost).
    type: STRING
  sensorCharacteristic:
    displayName: Distance sensor characteristic UUID
    description: >-
      The characteristic inside that service that sends the distance as
      notifications, e.g. 0xffe1. "Find my sensor" at /skilltree/sensor
      shows which one changes when you move the sensor.
    type: STRING
  sensorFormat:
    displayName: Distance sensor value format
    description: >-
      How the distance is encoded in each notification: uint8, uint16le
      (default; 2 bytes, little-endian, what most sensors send), uint16be,
      int16le, uint32le, float32le, or ascii (text like "123" followed by a
      newline, common with ESP32/serial modules).
    type: STRING
  sensorOffset:
    displayName: Distance sensor value offset (bytes)
    description: >-
      Where the value starts inside the notification, in bytes. Default 0;
      use 1 or 2 when the sensor sends a header or flags byte first.
    type: NUMBER
  sensorScale:
    displayName: Distance sensor scale
    description: >-
      Multiplies the decoded value, e.g. 0.1 when the sensor reports tenths
      of a millimetre. Default 1. Only the relative movement matters: the
      sensor calibration at /skilltree/sensor maps your rest and deepest
      positions to 0 and 100.
    type: NUMBER
  sensorValidMin:
    displayName: Distance sensor valid minimum
    description: >-
      Optional. Raw readings below this mean the sensor sees nothing (out of
      range); they read as fully out instead of a position. For the
      Reach-Trainer 31: its readings from 0 to 30 mean "no target".
    type: NUMBER
  sensorValidMax:
    displayName: Distance sensor valid maximum
    description: >-
      Optional. Raw readings above this mean the sensor sees nothing; they read
      as fully out.
    type: NUMBER
  sensorNamePrefix:
    displayName: Distance sensor name filter
    description: >-
      Optional. Only devices whose Bluetooth name starts with this text are
      offered in the browser's picker (e.g. "VL53" or "Reach"). Empty shows
      every nearby device.
    type: STRING
  trackMaxDepth:
    displayName: Track max depth (0-100)
    description: >-
      Your depth limit for track clips, as a position on the calibrated
      scale (0 = rest, 100 = your deepest calibrated point). Default 100 =
      no limit beyond the calibration. Below 100, sections that go deeper
      are still shown in the guide (with a line at your limit) but never
      scored, so there is no reason to go beyond it.
    type: NUMBER
  trackGlow:
    displayName: Track match glow (%)
    description: >-
      During track clips the video's edges light up strong green while you
      are on the target, and yellow turning red the further off you are
      (only in scored sections, with a connected, calibrated sensor). The
      colors ease in and out rather than flash. Strength 0-100, default 70;
      0 turns it off.
    type: NUMBER
  toyGate:
    displayName: Toys follow how well you track
    description: >-
      With the Toy Sync plugin installed and a toy connected, the toy runs
      from the clip's funscript. During track clips this makes its strength
      follow you: full while you are on the target (the green glow), fading
      to off the further off you are. Without a sensor reading the toy simply
      follows the script. On by default; turn off for plain script sync.
    type: BOOLEAN
  nudgeTrack:
    displayName: Nudge when far off the track
    description: >-
      With Toy Sync and a calibrated e-stim device (DG-LAB Coyote): staying
      far off the target for a second in a track clip sends a short sharp
      nudge at your calibrated nudge level, again every few seconds while it
      lasts. Toy Sync limits how often nudges can come. Only with a live,
      calibrated distance sensor. On by default (nothing happens without a
      calibrated e-stim device).
    type: BOOLEAN
  nudgeGaze:
    displayName: Nudge when the gaze isn't followed
    description: >-
      With Toy Sync and a calibrated e-stim device: looking away from the
      clip (seen by the eye tracker), or not following a gaze prompt (eyes
      open during "close your eyes", not looking where asked) for a second
      sends a short sharp nudge, again every few seconds while it lasts.
      Never without real evidence (the focus/activity fallback never
      nudges) and not while the window is in the background. On by default.
    type: BOOLEAN
  trackMaxHoldSec:
    displayName: Track max hold (seconds)
    description: >-
      Your longest hold for track clips. Default 8. Longer holds are shown
      but not scored. Stop the clip any time (Stop or Esc) if something
      doesn't feel right.
    type: NUMBER
  autoFullscreen:
    displayName: Start clips fullscreen
    description: >-
      On by default (also while this switch has never been set). A clip
      started with Watch on the choice screen goes fullscreen as soon as the
      player appears. Browsers only allow this shortly after a click, so
      after a page reload or a slow load the clip starts as usual (use the
      player's fullscreen button). Exposure loops never go fullscreen. Off:
      clips start in the page.
    type: BOOLEAN
  webcamRequired:
    displayName: Sessions need the webcam
    description: >-
      On by default (also while this switch has never been set). Sessions
      need a camera: before a clip starts you turn it on and must be in front
      of it, and while watching, leaving the camera's view counts as looking
      away. The pictures are analysed in the browser and never leave it; the
      camera turns off when the session ends. Off: sessions start without a
      camera too; when no camera is available, presence and webcam action
      prompts are skipped.
    type: BOOLEAN
  promptsEnabled:
    displayName: Check prompts in clips
    description: >-
      On by default (also while this switch has never been set). Checks the
      prompt markers of a clip: repeat after me, gaze targets and webcam
      actions. Off: prompts are not checked and don't count for or against a
      clip. Spend prompts are always asked.
    type: BOOLEAN
  speechEnabled:
    displayName: Microphone for repeat-after-me
    description: >-
      On by default (also while this switch has never been set). Uses the
      microphone and local speech recognition (nothing leaves the browser)
      for repeat-after-me prompts; the microphone is only open from about a
      second before such a prompt until it ends. Headphones help: the clip's
      own voice can be picked up. Off: repeat prompts are skipped.
    type: BOOLEAN
  videoAnalysis:
    displayName: Analyse the clip for gaze targets
    description: >-
      On by default (also while this switch has never been set). Runs
      MediaPipe on the playing clip around gaze prompts to find where the
      person's eyes, hands, hips and so on are, so "look at ..." prompts can
      be checked with an eye tracker. Needs the models from
      tools/fetch_models.sh. Off: gaze prompts that need the person are
      skipped.
    type: BOOLEAN
  gazeRegions:
    displayName: Where you look (gaze regions)
    description: >-
      On by default (also while this switch has never been set). With an eye
      tracker connected, the clip is analysed about twice a second to find
      the person's eyes, mouth, hands, chest and so on, and the time your
      gaze spends on each is counted. The session summary shows the shares;
      saved sessions add them to each performer of the clip (custom field
      st.gaze_regions). Everything is analysed in the browser. Needs
      "Analyse the clip for gaze targets". Off: nothing is analysed or saved.
    type: BOOLEAN
